<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp - Real-time Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            min-width: 250px;
        }
        .search-box button {
            padding: 12px 30px;
            background: #ffc107;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .search-box button:hover {
            background: #ffb300;
        }
        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }
        .weather-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .weather-header h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }
        .temperature {
            font-size: 80px;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }
        .condition {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
        }
        .weather-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .detail-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .detail-box h4 {
            color: #999;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .detail-box .value {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
        .forecast {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }
        .forecast h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .forecast-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .forecast-item h5 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .forecast-item p {
            font-size: 12px;
            color: #666;
        }
        .saved-locations {
            margin-top: 30px;
        }
        .saved-locations h3 {
            color: white;
            margin-bottom: 15px;
        }
        .location-list {
            display: grid;
            gap: 10px;
        }
        .location-item {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .location-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        @media (max-width: 600px) {
            .temperature { font-size: 48px; }
            .weather-details, .forecast-grid { grid-template-columns: repeat(2, 1fr); }
            header h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ WeatherApp</h1>
            <p>Your Personal Weather Station</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="fetchWeather()">Search</button>
        </div>

        <div class="weather-card" id="weatherCard" style="display: none;">
            <div class="weather-header">
                <h2 id="cityName">--</h2>
                <div class="temperature" id="temperature">--°C</div>
                <div class="condition" id="condition">--</div>
            </div>

            <div class="weather-details">
                <div class="detail-box">
                    <h4>Feels Like</h4>
                    <div class="value" id="feelsLike">--°C</div>
                </div>
                <div class="detail-box">
                    <h4>Humidity</h4>
                    <div class="value" id="humidity">--%</div>
                </div>
                <div class="detail-box">
                    <h4>Wind Speed</h4>
                    <div class="value" id="windSpeed">-- m/s</div>
                </div>
                <div class="detail-box">
                    <h4>Pressure</h4>
                    <div class="value" id="pressure">-- mb</div>
                </div>
            </div>

            <div class="forecast">
                <h3>4-Day Forecast</h3>
                <div class="forecast-grid" id="forecastGrid">
                    <!-- Forecast items will be loaded here -->
                </div>
            </div>
        </div>

        <div class="saved-locations">
            <h3>Saved Locations</h3>
            <div class="location-list" id="locationList">
                <p style="color: rgba(255, 255, 255, 0.7);">Search for a city to add it to your favorites</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/weather/';

        async function fetchWeather() {
            const city = document.getElementById('cityInput').value || 'London';
            
            try {
                const response = await fetch(`${API_URL}locations/weather/?city=${city}`);
                const data = await response.json();
                displayWeather(data);
                saveLocation(data.city, 'Country');
            } catch (error) {
                console.error('Error fetching weather:', error);
            }
        }

        function displayWeather(data) {
            document.getElementById('cityName').textContent = data.city;
            document.getElementById('temperature').textContent = data.temp + '°C';
            document.getElementById('condition').textContent = data.description;
            document.getElementById('feelsLike').textContent = data.feels_like + '°C';
            document.getElementById('humidity').textContent = data.humidity + '%';
            document.getElementById('windSpeed').textContent = data.wind_speed + ' m/s';
            document.getElementById('pressure').textContent = data.pressure + ' mb';

            const forecastGrid = document.getElementById('forecastGrid');
            forecastGrid.innerHTML = '';
            data.forecast.forEach(day => {
                const div = document.createElement('div');
                div.className = 'forecast-item';
                div.innerHTML = `
                    <h5>${day.day}</h5>
                    <p><strong>${day.high}°</strong> / ${day.low}°</p>
                    <p>${day.condition}</p>
                `;
                forecastGrid.appendChild(div);
            });

            document.getElementById('weatherCard').style.display = 'block';
        }

        async function saveLocation(city, country) {
            try {
                await fetch(`${API_URL}locations/add_location/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city, country })
                });
            } catch (error) {
                console.error('Error saving location:', error);
            }
        }

        // Fetch weather on page load
        fetchWeather();
    </script>
</body>
</html>
